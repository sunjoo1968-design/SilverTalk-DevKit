<svg xmlns="http://www.w3.org/2000/svg" width="890" height="970" viewBox="0 0 890 970" role="img"><title>SilverTalk DevKit 1.8 GPIO 배선도</title><rect width="890" height="970" fill="#f8fafc"/><g font-family="Malgun Gothic, sans-serif" fill="#102b3c"><text x="32" y="40" font-size="26" font-weight="bold">SilverTalk DevKit 배선도</text><text x="33" y="69" font-size="16">ESP32-WROOM-32 · SunjooAn · 펌웨어 1.8 · 앱 1.9</text><rect x="32" y="92" width="200" height="56" rx="10" fill="#dcecf6"/><rect x="334" y="92" width="205" height="56" rx="10" fill="#dcecf6"/><rect x="641" y="92" width="215" height="56" rx="10" fill="#dcecf6"/><path d="M232 120H334M539 120H641M435 92V77H628" stroke="#14658b" stroke-width="3" fill="none"/><text x="48" y="126">갤럭시 USB-C</text><text x="350" y="126">USB-C PD 허브</text><text x="657" y="126">DevKit USB-C 데이터</text><text x="641" y="81" font-size="13">PD 충전기 → 허브 PD 입력</text><rect x="32" y="170" width="210" height="724" rx="12" fill="#e2eff7"/><text x="52" y="195" font-weight="bold">ESP32 DevKit</text><rect x="515" y="195" width="342" height="128" rx="9" fill="#fff" stroke="#92afbd"/><text x="538" y="216" font-size="17" font-weight="bold">SSD1306 OLED · I²C 0x3C</text><path d="M242 235H515" stroke="#aa2923" stroke-width="2"/><circle cx="242" cy="235" r="4" fill="#aa2923"/><circle cx="515" cy="235" r="4" fill="#aa2923"/><text x="222" y="240" font-size="16" text-anchor="end">3V3</text><text x="538" y="240" font-size="16">VCC</text><path d="M242 259H515" stroke="#334155" stroke-width="2"/><circle cx="242" cy="259" r="4" fill="#334155"/><circle cx="515" cy="259" r="4" fill="#334155"/><text x="222" y="264" font-size="16" text-anchor="end">GND</text><text x="538" y="264" font-size="16">GND</text><path d="M242 283H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="283" r="4" fill="#14658b"/><circle cx="515" cy="283" r="4" fill="#14658b"/><text x="222" y="288" font-size="16" text-anchor="end">GPIO21</text><text x="538" y="288" font-size="16">SDA</text><path d="M242 307H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="307" r="4" fill="#14658b"/><circle cx="515" cy="307" r="4" fill="#14658b"/><text x="222" y="312" font-size="16" text-anchor="end">GPIO22</text><text x="538" y="312" font-size="16">SCL</text><rect x="515" y="334" width="342" height="80" rx="9" fill="#fff" stroke="#92afbd"/><text x="538" y="355" font-size="17" font-weight="bold">서비스 선택 · 유지형 스위치</text><path d="M242 374H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="374" r="4" fill="#14658b"/><circle cx="515" cy="374" r="4" fill="#14658b"/><text x="222" y="379" font-size="16" text-anchor="end">GPIO18</text><text x="538" y="379" font-size="16">한쪽 접점</text><path d="M242 398H515" stroke="#334155" stroke-width="2"/><circle cx="242" cy="398" r="4" fill="#334155"/><circle cx="515" cy="398" r="4" fill="#334155"/><text x="222" y="403" font-size="16" text-anchor="end">GND</text><text x="538" y="403" font-size="16">공통 접점</text><rect x="515" y="425" width="342" height="80" rx="9" fill="#fff" stroke="#92afbd"/><text x="538" y="446" font-size="17" font-weight="bold">대화 / 화면 깨우기 · 순간 NO</text><path d="M242 465H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="465" r="4" fill="#14658b"/><circle cx="515" cy="465" r="4" fill="#14658b"/><text x="222" y="470" font-size="16" text-anchor="end">GPIO23</text><text x="538" y="470" font-size="16">접점 1</text><path d="M242 489H515" stroke="#334155" stroke-width="2"/><circle cx="242" cy="489" r="4" fill="#334155"/><circle cx="515" cy="489" r="4" fill="#334155"/><text x="222" y="494" font-size="16" text-anchor="end">GND</text><text x="538" y="494" font-size="16">접점 2</text><rect x="515" y="516" width="342" height="80" rx="9" fill="#fff" stroke="#92afbd"/><text x="538" y="537" font-size="17" font-weight="bold">누르고 말하기 · 순간 NO</text><path d="M242 556H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="556" r="4" fill="#14658b"/><circle cx="515" cy="556" r="4" fill="#14658b"/><text x="222" y="561" font-size="16" text-anchor="end">GPIO25</text><text x="538" y="561" font-size="16">접점 1</text><path d="M242 580H515" stroke="#334155" stroke-width="2"/><circle cx="242" cy="580" r="4" fill="#334155"/><circle cx="515" cy="580" r="4" fill="#334155"/><text x="222" y="585" font-size="16" text-anchor="end">GND</text><text x="538" y="585" font-size="16">접점 2</text><rect x="515" y="607" width="342" height="152" rx="9" fill="#fff" stroke="#92afbd"/><text x="538" y="628" font-size="17" font-weight="bold">상태 LED · 각 LED에 220Ω 하나</text><path d="M242 647H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="647" r="4" fill="#14658b"/><circle cx="515" cy="647" r="4" fill="#14658b"/><text x="222" y="652" font-size="16" text-anchor="end">GPIO19</text><text x="538" y="652" font-size="16">220Ω → 마이크 LED 양극</text><path d="M242 671H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="671" r="4" fill="#14658b"/><circle cx="515" cy="671" r="4" fill="#14658b"/><text x="222" y="676" font-size="16" text-anchor="end">GPIO26</text><text x="538" y="676" font-size="16">220Ω → 대화 버튼 LED 양극</text><path d="M242 695H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="695" r="4" fill="#14658b"/><circle cx="515" cy="695" r="4" fill="#14658b"/><text x="222" y="700" font-size="16" text-anchor="end">GPIO27</text><text x="538" y="700" font-size="16">220Ω → A 위치 LED 양극</text><path d="M242 719H515" stroke="#14658b" stroke-width="2"/><circle cx="242" cy="719" r="4" fill="#14658b"/><circle cx="515" cy="719" r="4" fill="#14658b"/><text x="222" y="724" font-size="16" text-anchor="end">GPIO32</text><text x="538" y="724" font-size="16">220Ω → B 위치 LED 양극</text><path d="M242 743H515" stroke="#334155" stroke-width="2"/><circle cx="242" cy="743" r="4" fill="#334155"/><circle cx="515" cy="743" r="4" fill="#334155"/><text x="222" y="748" font-size="16" text-anchor="end">GND</text><text x="538" y="748" font-size="16">LED 4개의 음극</text>
<rect x="515" y="773" width="342" height="120" rx="9" fill="#fff" stroke="#92afbd"/>
<text x="538" y="796" font-size="17" font-weight="bold">연속 대화 버튼과 LED · 선택</text>
<path d="M242 817H515" stroke="#14658b" stroke-width="2"/>
<circle cx="242" cy="817" r="4" fill="#14658b"/><circle cx="515" cy="817" r="4" fill="#14658b"/>
<text x="222" y="822" font-size="16" text-anchor="end">GPIO33</text><text x="538" y="822" font-size="16">순간 NO 버튼의 한쪽 접점</text>
<path d="M242 843H515" stroke="#14658b" stroke-width="2"/>
<circle cx="242" cy="843" r="4" fill="#14658b"/><circle cx="515" cy="843" r="4" fill="#14658b"/>
<text x="222" y="848" font-size="16" text-anchor="end">GPIO13</text><text x="538" y="848" font-size="16">220Ω → 전용 LED 양극</text>
<path d="M242 869H515" stroke="#334155" stroke-width="2"/>
<circle cx="242" cy="869" r="4" fill="#334155"/><circle cx="515" cy="869" r="4" fill="#334155"/>
<text x="222" y="874" font-size="16" text-anchor="end">GND</text><text x="538" y="874" font-size="16">버튼 반대쪽 접점과 LED 음극</text>
<text x="32" y="922" font-size="15">GPIO18 개방 = A · GND 연결 = B · 순간식 버튼은 누르면 GND</text><text x="32" y="948" font-size="15">전원을 분리한 뒤 배선합니다. LED와 스위치 모두 공통 GND를 사용합니다.</text></g></svg>



